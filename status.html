<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#070707"/>
  <meta name="description" content="Публичный статус AXON"/>
  <title>AXON статус</title>
  <link rel="icon" href="favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    :root{--bg:#070707;--panel:#121212;--ink:#ececec;--muted:#7a7a7a;--accent:#c5ff3a;--line:#2a2a2a;--bad:#ff5a5a;--mono:"Cascadia Mono",Consolas,monospace}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(900px 420px at 12% -10%,rgba(197,255,58,.08),transparent 60%),var(--bg);color:var(--ink);font-family:Bahnschrift,"Segoe UI",sans-serif}
    main{max-width:760px;margin:0 auto;padding:72px 24px 100px}
    h1{margin:0 0 8px;color:var(--accent);font-size:30px;letter-spacing:.05em}
    .lead,.updated{margin:0;color:var(--muted);font-family:var(--mono);font-size:12px;line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:30px 0 14px}
    .card{border:1px solid var(--line);background:var(--panel);padding:18px}
    .label{display:block;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.12em}
    strong{display:block;margin-top:9px;font-family:var(--mono);font-size:22px;color:var(--accent);word-break:break-word}
    .state{border:1px solid var(--line);background:var(--panel);padding:18px;font-family:var(--mono);font-size:13px}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:8px}
    .dot.bad{background:var(--bad)}
    a{color:var(--accent)}
    @media(max-width:620px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <h1>AXON СТАТУС</h1>
    <p class="lead">Публичная сводка каталога и релиза. Страница не использует секреты.</p>
    <div class="grid">
      <section class="card"><span class="label">СТРАТЕГИИ CATALOG</span><strong id="strategies">...</strong></section>
      <section class="card"><span class="label">ПОСЛЕДНЯЯ ВЕРСИЯ</span><strong id="version">...</strong></section>
      <section class="card"><span class="label">PACK INDEX</span><strong id="packs">...</strong></section>
    </div>
    <div class="state"><span class="dot" id="dot"></span><span id="health">Проверяем общедоступные файлы...</span></div>
    <p class="updated" id="updated" style="margin-top:16px"></p>
    <p class="updated" style="margin-top:28px"><a href="./">На главную</a></p>
  </main>
  <script>
    const raw = 'https://raw.githubusercontent.com/awkcrud/axon-site/catalog/';
    const $ = id => document.getElementById(id);
    const fetchJson = path => fetch(raw + path + '?t=' + Date.now(), { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
    Promise.allSettled([
      fetchJson('strategies/catalog.json'),
      fetchJson('latest.json'),
      fetchJson('packs/index.json'),
    ]).then(results => {
      const [catalog, latest, packIndex] = results;
      const catalogOk = catalog.status === 'fulfilled';
      const latestOk = latest.status === 'fulfilled';
      $('strategies').textContent = catalogOk ? String((catalog.value.strategies || []).length) : 'нет данных';
      $('version').textContent = latestOk ? 'v' + (latest.value.version || '?') : 'нет данных';
      $('packs').textContent = packIndex.status === 'fulfilled' ? String((packIndex.value.packs || []).length) : 'не создан';
      const healthy = catalogOk && latestOk;
      $('health').textContent = healthy ? 'Основные публичные файлы доступны' : 'Часть публичных файлов недоступна';
      if (!healthy) $('dot').classList.add('bad');
      const date = latestOk && latest.value.releasedAt ? new Date(latest.value.releasedAt).toLocaleString('ru-RU') : new Date().toLocaleString('ru-RU');
      $('updated').textContent = 'Проверено: ' + date;
    }).catch(() => {
      $('health').textContent = 'Не удалось проверить статус';
      $('dot').classList.add('bad');
    });
  </script>
</body>
</html>
